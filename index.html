<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chaewon Go</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>
        <a href="index.html" class="nav-logo">chaewon go</a>
        <ul class="nav-links">
            <li><a href="about.html">about</a></li>
            <li><a href="index.html" class="active">works</a></li>
            <li><a href="contact.html">contact</a></li>
        </ul>
    </nav>

    <main>
        <div class="works-grid">

            <div class="work-item" onclick="openModal('p1')">
                <img src="0-1.png" alt="Urban Catalyst">
            </div>

            <div class="work-item" onclick="openModal('p2')">
                <img src="https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=600&q=80" alt="Co-Living Housing">
            </div>

            <div class="work-item" onclick="openModal('p3')">
                <img src="https://images.unsplash.com/photo-1541881451970-1d8984918f6c?auto=format&fit=crop&w=600&q=80" alt="Eco Pavilion">
            </div>

            <div class="work-item" onclick="openModal('p4')">
                <img src="https://images.unsplash.com/photo-1431540015161-0bf868a2d407?auto=format&fit=crop&w=600&q=80" alt="Public Art Museum">
            </div>

            <div class="work-item" onclick="openModal('p5')">
                <img src="https://images.unsplash.com/photo-1503387762-592deb58ef4e?auto=format&fit=crop&w=600&q=80" alt="Parametric Canopy">
            </div>

            <div class="work-item" onclick="openModal('p6')">
                <img src="https://images.unsplash.com/photo-1513694203232-719a280e022f?auto=format&fit=crop&w=600&q=80" alt="Model Archives">
            </div>

        </div>
    </main>

    <!-- MODAL -->
    <div id="modal" class="modal-overlay" onclick="handleOverlayClick(event)">
        <div class="modal-box">
            <button class="modal-close" onclick="closeModal()">close</button>
            <div id="modal-content"></div>
        </div>
    </div>

    <script>
        const data = {
            p1: { title: "Urban Catalyst", sub: "Graduation Project · 2026", desc: "도심 속 단절된 공간을 연결하는 졸업 설계 프로젝트. 지역 주민을 위한 열린 커뮤니티 시설과 청년 창업 공간을 결합하고, 매스의 분절과 브릿지를 통해 다채로운 동선을 유도했습니다.", img: "0-1.png" },
            p2: { title: "Co-Living Housing", sub: "4th Year Studio · 2025", desc: "급증하는 1인 가구를 위한 새로운 주거 대안. 개인의 프라이버시를 보장하면서도 공용 공간을 통해 자연스러운 커뮤니티가 형성되도록 공간을 배치했습니다.", img: "https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=1200&q=80" },
            p3: { title: "Eco Pavilion", sub: "Competition Entry · 2024", desc: "친환경 소재와 모듈러 시스템을 활용한 파빌리온 공모전 출품작(우수상). 곡선 형태의 루버를 통해 빛의 유입을 조절하고 내부 공간에 아름다운 그림자를 만들어냅니다.", img: "https://images.unsplash.com/photo-1541881451970-1d8984918f6c?auto=format&fit=crop&w=1200&q=80" },
            p4: { title: "Public Art Museum", sub: "3rd Year Studio · 2024", desc: "빛과 자연을 담아내는 미술관 프로젝트. 제주도의 특수한 지형에 순응하며, 동선을 따라 전시 공간과 중정이 교차되도록 설계했습니다.", img: "https://images.unsplash.com/photo-1431540015161-0bf868a2d407?auto=format&fit=crop&w=1200&q=80" },
            p5: { title: "Parametric Canopy", sub: "Digital Fabrication · 2023", desc: "Rhino와 Grasshopper를 활용한 파라메트릭 디자인 스터디. 알고리즘을 통해 햇빛 일조량에 따라 루버 각도가 최적화되도록 설계했습니다.", img: "https://images.unsplash.com/photo-1503387762-592deb58ef4e?auto=format&fit=crop&w=1200&q=80" },
            p6: { title: "Model Archives", sub: "Physical Model · 2022–2025", desc: "학부 기간 동안 작업한 다양한 스터디 모델과 최종 모형들의 아카이브. 다양한 재료를 활용한 모델링 기법을 실험하며 도면상의 공간을 3차원으로 실체화하는 과정을 기록했습니다.", img: "https://images.unsplash.com/photo-1513694203232-719a280e022f?auto=format&fit=crop&w=1200&q=80" }
        };

        function openModal(id) {
            const d = data[id];
            document.getElementById('modal-content').innerHTML = `
                <img src="${d.img}" alt="${d.title}">
                <p class="modal-title">${d.title}</p>
                <p class="modal-sub">${d.sub}</p>
                <p class="modal-desc">${d.desc}</p>`;
            document.getElementById('modal').classList.add('open');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('open');
            document.body.style.overflow = '';
        }

        function handleOverlayClick(e) {
            if (e.target === document.getElementById('modal')) closeModal();
        }

        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
    </script>
</body>
</html>
