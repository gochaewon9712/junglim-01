<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact — Chaewon Go</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>
        <a href="index.html" class="nav-logo">chaewon go</a>
        <ul class="nav-links">
            <li><a href="about.html">about</a></li>
            <li><a href="index.html">works</a></li>
            <li><a href="contact.html" class="active">contact</a></li>
        </ul>
    </nav>

    <main>
        <div class="contact-wrap">

            <div class="contact-left">
                <h1>let's<br><em>connect</em>.</h1>

                <div class="contact-info-row">
                    <p class="contact-label">university</p>
                    <p class="contact-value">경희대학교 국제캠퍼스 건축학과</p>
                </div>
                <div class="contact-info-row">
                    <p class="contact-label">email</p>
                    <p class="contact-value">
                        <a href="mailto:gochaewon9712@gmail.com">gochaewon9712@gmail.com</a>
                    </p>
                </div>
                <div class="contact-info-row">
                    <p class="contact-label">phone</p>
                    <p class="contact-value">+82 010 0000 0000</p>
                </div>
                <div class="contact-info-row">
                    <p class="contact-label">social</p>
                    <p class="contact-value">
                        <a href="#">instagram</a> &nbsp;·&nbsp;
                        <a href="#">behance</a> &nbsp;·&nbsp;
                        <a href="#">linkedin</a>
                    </p>
                </div>
            </div>

            <form onsubmit="submitForm(event)">
                <div class="form-row-2">
                    <div class="form-field">
                        <label for="name">name</label>
                        <input type="text" id="name" placeholder="your name" required>
                    </div>
                    <div class="form-field">
                        <label for="email">email</label>
                        <input type="email" id="email" placeholder="your@email.com" required>
                    </div>
                </div>
                <div class="form-field">
                    <label for="subject">subject</label>
                    <input type="text" id="subject" placeholder="project inquiry">
                </div>
                <div class="form-field">
                    <label for="message">message</label>
                    <textarea id="message" rows="6" placeholder="tell me about your project..." required></textarea>
                </div>
                <button type="submit" class="form-submit">send message →</button>
                <p id="form-success">메시지가 전송되었습니다.</p>
            </form>

        </div>
    </main>

    <footer>© 2026 chaewon go</footer>

    <script>
        function submitForm(e) {
            e.preventDefault();
            const btn = e.target.querySelector('.form-submit');
            btn.textContent = 'sending...';
            btn.disabled = true;
            setTimeout(() => {
                e.target.reset();
                btn.textContent = 'send message →';
                btn.disabled = false;
                document.getElementById('form-success').style.display = 'block';
                setTimeout(() => document.getElementById('form-success').style.display = 'none', 4000);
            }, 1200);
        }
    </script>

</body>
</html>
