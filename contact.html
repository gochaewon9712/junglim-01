<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact — Chaewon Go</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .contact-wrap {
            padding: 80px var(--page-margin) 0;
            display: grid;
            grid-template-columns: 1fr 1.4fr;
            gap: 80px;
            align-items: start;
        }

        /* left */
        .contact-heading {
            font-family: 'IM Fell English', serif;
            font-size: clamp(36px, 4vw, 56px);
            font-weight: 400;
            line-height: 1.05;
            margin-bottom: 48px;
        }

        .contact-info-item {
            padding: 18px 0;
            border-bottom: 1px solid var(--rule);
        }

        .contact-info-item:first-of-type { border-top: 1px solid var(--rule); }

        .contact-info-label {
            font-size: 9px;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--ink-faint);
            margin-bottom: 5px;
        }

        .contact-info-value {
            font-size: 12px;
            color: var(--ink-mid);
        }

        .contact-info-value a {
            color: var(--ink-mid);
            text-decoration: none;
            transition: color 0.2s;
        }

        .contact-info-value a:hover { color: var(--ink); }

        /* right: form */
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 24px;
        }

        .form-group label {
            font-size: 9px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--ink-faint);
        }

        .form-group input,
        .form-group textarea {
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--rule);
            padding: 10px 0;
            font-family: 'Space Mono', monospace;
            font-size: 12px;
            color: var(--ink);
            outline: none;
            transition: border-color 0.2s;
            resize: none;
            width: 100%;
        }

        .form-group input:focus,
        .form-group textarea:focus { border-color: var(--ink); }

        .form-group input::placeholder,
        .form-group textarea::placeholder { color: var(--ink-faint); }

        .form-submit {
            background: var(--ink);
            color: var(--cream);
            border: none;
            padding: 13px 32px;
            font-family: 'Space Mono', monospace;
            font-size: 10px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .form-submit:hover { opacity: 0.72; }

        #form-success {
            display: none;
            font-size: 10px;
            letter-spacing: 0.12em;
            color: var(--accent);
            margin-top: 14px;
        }

        @media (max-width: 768px) {
            .contact-wrap { grid-template-columns: 1fr; gap: 48px; }
            .form-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <nav>
        <ul class="nav-links-left">
            <li><a href="about.html">about</a></li>
            <li><a href="index.html#works">works</a></li>
        </ul>
        <a href="index.html" class="nav-logo">chaewon go</a>
        <ul class="nav-links-right">
            <li><a href="contact.html" class="active">contact</a></li>
        </ul>
    </nav>

    <div class="page-wrap">
        <div class="contact-wrap">

            <div>
                <h1 class="contact-heading reveal">
                    Let's<br>connect.
                </h1>

                <div class="contact-info-item reveal">
                    <p class="contact-info-label">University</p>
                    <p class="contact-info-value">경희대학교 국제캠퍼스 건축학과</p>
                </div>
                <div class="contact-info-item reveal">
                    <p class="contact-info-label">Email</p>
                    <p class="contact-info-value">
                        <a href="mailto:gochaewon9712@gmail.com">gochaewon9712@gmail.com</a>
                    </p>
                </div>
                <div class="contact-info-item reveal">
                    <p class="contact-info-label">Phone</p>
                    <p class="contact-info-value">+82 010 5216 0750</p>
                </div>
                <div class="contact-info-item reveal">
                    <p class="contact-info-label">Social</p>
                    <p class="contact-info-value">
                        <a href="#">Instagram</a> &nbsp;·&nbsp;
                        <a href="#">Behance</a> &nbsp;·&nbsp;
                        <a href="#">LinkedIn</a>
                    </p>
                </div>
            </div>

            <div class="reveal">
                <form onsubmit="submitForm(event)">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="name">Name</label>
                            <input type="text" id="name" placeholder="Your name" required>
                        </div>
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" placeholder="your@email.com" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="subject">Subject</label>
                        <input type="text" id="subject" placeholder="Project inquiry">
                    </div>
                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" rows="6" placeholder="Tell me about your project..." required></textarea>
                    </div>
                    <button type="submit" class="form-submit">Send Message</button>
                    <p id="form-success">메시지가 전송되었습니다. 곧 연락드리겠습니다.</p>
                </form>
            </div>

        </div>

        <footer>
            <span class="footer-copy">© 2026 Chaewon Go</span>
            <div class="footer-socials">
                <a href="#">instagram</a>
                <a href="#">behance</a>
                <a href="#">linkedin</a>
            </div>
        </footer>
    </div>

    <script>
        function submitForm(e) {
            e.preventDefault();
            const btn = e.target.querySelector('.form-submit');
            btn.textContent = 'Sending...';
            btn.disabled = true;
            setTimeout(() => {
                e.target.reset();
                btn.textContent = 'Send Message';
                btn.disabled = false;
                document.getElementById('form-success').style.display = 'block';
                setTimeout(() => document.getElementById('form-success').style.display = 'none', 5000);
            }, 1500);
        }

        const observer = new IntersectionObserver((entries) => {
            entries.forEach((entry, i) => {
                if (entry.isIntersecting) {
                    setTimeout(() => entry.target.classList.add('visible'), i * 80);
                    observer.unobserve(entry.target);
                }
            });
        }, { threshold: 0.08 });
        document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
    </script>
</body>
</html>
